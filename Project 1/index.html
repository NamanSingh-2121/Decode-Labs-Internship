<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LANDING PAGE -->
  <div class="landing" id="landing">
    <div class="landing-card">
      <h1 class="landing-title">Jarvis AI</h1>
      <p class="landing-subtitle">A simple rule-based chat program.</p>
      <p class="landing-text">
        Jarvis AI replies using a fixed set of rules stored in a dictionary.
        There is no external service or API involved, every response is
        written by hand.
      </p>
      <button id="startBtn" class="start-btn">Start Chat</button>
    </div>
  </div>

  <!-- CHAT WINDOW -->
  <div class="chat-box">
    <div class="chat-header">
      <span class="chat-title">Jarvis AI</span>
      <button id="exitBtn" class="exit-btn" title="Close chat">&times;</button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot-message">
        Hello. I am Jarvis AI. Type "help" to see what I can respond to.
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
